; ============================================================================
; PlatformIO 项目配置文件 (platformio.ini)
; ============================================================================
; 这个文件告诉 PlatformIO 如何编译和上传你的项目。
; 每一行以分号(;)开头的是注释，不会被程序执行。
;
; 【新手必读】
; PlatformIO 是一个跨平台的嵌入式开发工具，它可以：
;   1. 自动下载和管理库文件（类似于 pip/npm）
;   2. 自动选择正确的编译器和上传工具
;   3. 支持数百种不同的开发板
;
; 【文件结构说明】
; [env:环境名]  -  定义一个编译环境，你可以有多个环境
;                  比如一个调试用，一个发布用
; ============================================================================

; --- 环境定义 ---
; "env" = environment（环境），冒号后面是你给这个环境起的名字
; 通常用开发板型号命名，方便识别
[env:esp32-s3-devkitc-1]

; --- 平台和开发板 ---
; platform: 指定芯片平台，espressif32 = Espressif 公司的 ESP32 系列芯片
;            PlatformIO 会自动下载对应的编译工具链（gcc、esptool 等）
platform = espressif32

; board: 指定具体的开发板型号
;        ESP32-S3-DevKitC-1 是乐鑫官方的 ESP32-S3 开发板
;        这个配置决定了引脚定义、Flash 大小、上传速度等
board = esp32-s3-devkitc-1

; framework: 指定编程框架
;            arduino = 使用 Arduino 框架（最流行的嵌入式框架之一）
;            这意味着你可以使用熟悉的 Arduino 函数：
;            digitalWrite(), analogRead(), delay(), Serial.println() 等
framework = arduino

; --- 额外库目录 ---
; lib_extra_dirs: 告诉 PlatformIO 去额外的目录寻找库文件
;                 ~/ 在 Windows 上表示 C:\Users\你的用户名\
;                 ~/Documents/Arduino/libraries 是 Arduino IDE 默认的库目录
;                 这样 PlatformIO 也能使用你通过 Arduino IDE 安装的库
lib_extra_dirs = ~/Documents/Arduino/libraries

; --- 项目依赖库 ---
; lib_deps: 列出项目需要的第三方库
;           PlatformIO 会自动从注册表下载这些库到 .pio/libdeps/ 目录
;           格式: 作者/库名 @ 版本号
;           ^ 表示"兼容版本"（允许小版本更新，大版本不变）
lib_deps =
    ; U8g2: OLED/LCD 图形库，支持多种显示器（SSD1306、SH1106 等）
    ;       包含大量字体，支持中文显示（通过 UTF-8 编码）
    olikraus/U8g2@^2.36.18

    ; Adafruit GFX Library: Adafruit 出品的通用图形库
    ;                       提供画点、画线、画矩形、显示文字等基本功能
    ;                       它是许多显示驱动库的基础
    adafruit/Adafruit GFX Library @ ^1.11.0

    ; Adafruit ILI9341: ILI9341 芯片的 TFT LCD 驱动库
    ;                   依赖 Adafruit GFX Library
    ;                   支持 240x320 分辨率的彩色 SPI 屏幕
    adafruit/Adafruit ILI9341 @ ^1.6.0
