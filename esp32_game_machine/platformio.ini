; PlatformIO 配置 - 双环境设计
; - wokwi 环境: 仿真用，定义 WOKWI_SIM 宏，主屏改用 SSD1306 (因为 Wokwi 没 ST7920)
; - hardware 环境: 烧实物用，使用真实硬件驱动
;
; 编译命令:
;   pio run                       # 默认编译 wokwi（仿真）
;   pio run -e hardware           # 编译实物固件
;   pio run -e hardware -t upload # 烧录实物

[platformio]
src_dir = .
default_envs = wokwi

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    olikraus/U8g2 @ ^2.35.30
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=2

[env:wokwi]
build_flags =
    ${env.build_flags}
    -DWOKWI_SIM

[env:hardware]
build_flags =
    ${env.build_flags}
